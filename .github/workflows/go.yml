name: go
on: workflow_dispatch
permissions: write-all
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: clean
          name: Proxyman-clean
          files: |
            Proxyman-clean.ipa
            Proxyman.entitlements
