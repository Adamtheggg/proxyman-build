name: b3
on: [workflow_dispatch, push]
permissions: write-all
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build3.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2
          name: Proxyman variants
          files: |
            A-with-plugins.ipa
            B-no-plugins.ipa
            bare-entitlements.plist
