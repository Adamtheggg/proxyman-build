name: prep
on: [workflow_dispatch, push]
permissions: write-all
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: clean
          name: Proxyman-clean
          files: |
            Proxyman-clean.ipa
            Proxyman.entitlementsname: prep
on: [workflow_dispatch, push]
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: bash build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: clean
          name: Proxyman 26.4.1 cleaned
          files: Proxyman-clean.ipa
