name: sig
on: [workflow_dispatch, push]
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -o a.ipa https://github.com/Adamtheggg/proxyman-build/releases/download/v1/com.nsproxy.NSProxy-iOS-26.4.1-eeveedecrypter.ipa
          unzip -q a.ipa -d x
          A=x/Payload/Proxyman.app
          echo LIST; ls -1 $A
          echo CS; ls -1 $A/_CodeSignature || echo NOCS
          echo PROF; find x -name '*mobileprovision' -o -name '*provisionprofile' | head
